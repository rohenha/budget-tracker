name: Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    name: Unit & Functional Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14
          cache: npm

      - name: Install dependencies
        run: NODE_ENV=development npm install

      - name: Run tests
        run: npm run test
        env:
          NODE_ENV: test
          TZ: UTC
          PORT: 3333
          HOST: localhost
          LOG_LEVEL: error
          APP_KEY: ${{ secrets.APP_KEY || 'test-secret-key-for-ci-only-32chars' }}
          APP_URL: http://localhost:3333
          SESSION_DRIVER: memory
          DB_CONNECTION: sqlite
